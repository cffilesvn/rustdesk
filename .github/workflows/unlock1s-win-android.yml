name: UNLOCK1S Windows Android

on:
  workflow_dispatch:

jobs:
  build-client:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: unlock1s-desk
      windows-android-only: true
      unlock1s-role: client

  build-host:
    needs: build-client
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: unlock1s-desk
      windows-android-only: true
      unlock1s-role: host
